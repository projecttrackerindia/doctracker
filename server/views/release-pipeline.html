<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Release Pipeline — DocTracker</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script src="/js/idle-session.js"></script>
<script nonce="__CSP_NONCE__">
// Same localStorage key the Studio, editor, and audit-log tabs use, applied
// before first paint, so this tab never flashes a different theme than the
// rest of the app.
(function(){
  var t = localStorage.getItem('apiStudio_theme');
  document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
})();
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
:root{
  --bg:#0a0e15; --bg-elevated:#0d1219; --surface:#121822; --surface-2:#171f2b; --surface-hover:#1c2531;
  --border:#212a38; --border-strong:#2c3648; --text:#e9edf5; --text-dim:#909cb0; --text-faint:#576277;
  --accent:#5c7cfa; --accent-soft:rgba(92,124,250,.14); --accent-contrast:#fff;
  --danger:#ef5c6e; --danger-soft:rgba(239,92,110,.14);
  --get:#4fa3f7; --post:#35c491; --put:#e0a83e; --patch:#b389f0; --delete:#ef5c6e;
  --sans:'Inter', system-ui, sans-serif; --mono:'JetBrains Mono', ui-monospace, monospace;
}
/* Same light palette as the Studio, editor, and audit-log tabs, so none of
   these ever look like a different product. */
[data-theme="light"]{
  --bg:#f5f6fa; --bg-elevated:#ffffff; --surface:#ffffff; --surface-2:#f1f3f8; --surface-hover:#e9ecf4;
  --border:#e1e5ee; --border-strong:#ccd3e2; --text:#12151f; --text-dim:#5a6479; --text-faint:#8993a8;
  --accent:#4a5fe0; --accent-soft:rgba(74,95,224,.09); --accent-contrast:#fff;
  --danger:#d13750; --danger-soft:rgba(209,55,80,.10);
  --get:#1f6fd6; --post:#1c8f66; --put:#a06f10; --patch:#7a4fd1; --delete:#d13750;
}
*{ box-sizing:border-box; }
html{ color-scheme:dark; }
html[data-theme="light"]{ color-scheme:light; }
body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
a{ color:inherit; }
.mono{ font-family:var(--mono); }
::selection{ background:var(--accent-soft); }
.rp-wrap{ max-width:1100px; margin:0 auto; padding:28px clamp(20px,4vw,56px) 70px; }

/* ---- Header (mirrors the audit-log / architecture-studio tabs) ---- */
.rp-theme-toggle{
  display:flex; align-items:center; justify-content:center; width:36px; height:36px; flex-shrink:0;
  background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--text-dim); font-size:14px; cursor:pointer;
}
.rp-theme-toggle:hover{ background:var(--surface-hover); color:var(--text); }
.rp-header{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
.rp-title{ display:flex; align-items:center; gap:12px; min-width:0; }
.rp-title .mark{ width:38px; height:38px; border-radius:10px; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; flex-shrink:0;
  font-weight:800; font-family:var(--mono); font-size:15px; }
.rp-title h1{ margin:0; font-size:19px; font-weight:800; letter-spacing:-.2px; }
.rp-title .sub{ margin-top:2px; font-size:11.5px; color:var(--text-faint); }
.rp-back{
  display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--text-dim);
  text-decoration:none; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 14px; flex-shrink:0;
}
.rp-back:hover{ color:var(--text); border-color:var(--border-strong); background:var(--surface-hover); }

.rp-section{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:20px; }
.rp-section-title{ font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--text-faint); margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
.rp-loading, .rp-empty{ padding:30px 0; text-align:center; color:var(--text-faint); font-size:13px; }

.field{ display:flex; flex-direction:column; gap:5px; }
.field label{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--text-faint); }
select, textarea, input[type="text"]{ font-family:var(--sans); color:var(--text); background:var(--bg-elevated); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:12.5px; }
select:focus, textarea:focus, input:focus{ outline:none; border-color:var(--accent); }
button{ font-family:var(--sans); cursor:pointer; }

/* ---- Ported from studio.html's Project settings ▸ Release Pipeline (same
   classnames, same tokens) — see server/routes/workspace.js for the API
   contract these render against. ---- */
.rp-strip{ display:flex; align-items:center; flex-wrap:wrap; gap:0; margin-bottom:18px; }
.rp-strip-chip{
  display:flex; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--border);
  border-left:3px solid var(--rp-accent, var(--border-strong)); border-radius:9px; padding:7px 12px;
}
.rp-strip-chip-label{ font-family:var(--mono); font-size:11.5px; font-weight:800; color:var(--text); }
.rp-strip-chip-version{ font-size:11px; color:var(--text-faint); }
.rp-strip-chip-version.empty{ font-style:italic; }
.rp-draft-pill{ font-family:var(--sans); font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--accent); background:var(--accent-soft); padding:2px 7px; border-radius:999px; }
.rp-history-toggle{ font-family:var(--sans); font-size:10.5px; font-weight:650; color:var(--accent); background:none; border:none; cursor:pointer; padding:0; margin-top:2px; text-align:left; }
.rp-history-toggle:hover{ text-decoration:underline; }
.rp-history-list{ margin:10px 0 16px; padding:12px 14px; border:1px solid var(--border); border-radius:10px; background:var(--surface-2); }
.rp-history-title{ font-size:12px; font-weight:700; margin-bottom:8px; }
.rp-history-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:7px 0; border-top:1px solid var(--border); }
.rp-history-row:first-of-type{ border-top:none; }
.rp-history-row.current{ opacity:.85; }
.rp-history-row-main{ display:flex; flex-direction:column; gap:2px; font-size:12px; }
.rp-history-empty{ font-size:12px; color:var(--text-faint); }
.rp-strip-arrow{ color:var(--text-faint); padding:0 6px; display:flex; }
.rp-mirror-inline{
  display:flex; align-items:center; gap:6px; margin-left:14px; padding-left:14px; border-left:1px dashed var(--border);
  font-size:11px; color:var(--text-faint);
}
.rp-mirror-inline b{ color:var(--text-dim); font-family:var(--mono); }

/* From/To diff panel */
.rp-diffbar{ display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
.rp-diffbar .field{ margin:0; flex:1; min-width:180px; }
.rp-diffbar .field label{ font-size:10.5px; }
.rp-diffbar select{
  width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--border);
  background:var(--bg-elevated); color:var(--text); font-size:12.5px;
}
.rp-diffbar-swap{
  flex-shrink:0; width:32px; height:32px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2);
  color:var(--text-dim); cursor:pointer; display:flex; align-items:center; justify-content:center; margin-bottom:1px;
}
.rp-diffbar-swap:hover{ border-color:var(--accent); color:var(--accent); }

.rp-diff-summary{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
.rp-diff-count{ font-size:12px; font-weight:700; display:flex; align-items:center; gap:5px; }
.rp-diff-count.added{ color:#2e9e5b; }
.rp-diff-count.removed{ color:var(--danger); }
.rp-diff-count.modified{ color:var(--accent); }
.rp-diff-count .swatch{ width:9px; height:9px; border-radius:2px; background:currentColor; }
.rp-diff-nochanges{ font-size:12.5px; color:var(--text-faint); padding:22px 0; text-align:center; }
.rp-breaking-callout{ background:rgba(224,168,62,.10); border:1px solid rgba(224,168,62,.35); border-radius:8px; padding:12px 14px; margin-bottom:14px; }
.rp-breaking-head{ font-size:13px; font-weight:700; color:#c98a1f; display:flex; align-items:center; gap:7px; margin-bottom:8px; }
.rp-breaking-icon{ font-size:14px; }
.rp-breaking-list{ margin:0 0 10px 0; padding-left:20px; font-size:12px; color:var(--text-dim); line-height:1.6; }
.rp-breaking-list li{ margin-bottom:2px; }
.rp-breaking-ack{ display:flex; align-items:flex-start; gap:8px; font-size:12px; font-weight:600; color:var(--text); cursor:pointer; }
.rp-breaking-ack input{ margin-top:2px; }

.rp-diff-list{ display:flex; flex-direction:column; gap:8px; }
.rp-diff-ep{ border:1px solid var(--border); border-radius:10px; overflow:hidden; background:var(--surface); }
.rp-diff-ep-head{
  display:flex; align-items:center; gap:10px; padding:10px 13px; cursor:pointer; user-select:none;
}
.rp-diff-ep.added .rp-diff-ep-head{ background:color-mix(in srgb, #2e9e5b 8%, transparent); }
.rp-diff-ep.removed .rp-diff-ep-head{ background:color-mix(in srgb, var(--danger) 8%, transparent); }
.rp-diff-ep.modified .rp-diff-ep-head{ background:color-mix(in srgb, var(--accent) 7%, transparent); }
.rp-diff-marker{ font-family:var(--mono); font-weight:800; font-size:13px; width:14px; text-align:center; flex-shrink:0; }
.rp-diff-ep.added .rp-diff-marker{ color:#2e9e5b; }
.rp-diff-ep.removed .rp-diff-marker{ color:var(--danger); }
.rp-diff-ep.modified .rp-diff-marker{ color:var(--accent); }
.rp-diff-ep-method{ font-family:var(--mono); font-size:10.5px; font-weight:800; padding:2px 6px; border-radius:5px; background:var(--surface-2); color:var(--text-dim); flex-shrink:0; }
.rp-diff-ep-path{ font-family:var(--mono); font-size:12.5px; color:var(--text); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rp-diff-ep-summary{ font-size:11px; color:var(--text-faint); flex-shrink:0; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rp-diff-ep-count{ font-size:10.5px; color:var(--text-faint); flex-shrink:0; }
.rp-diff-ep-caret{ color:var(--text-faint); flex-shrink:0; transition:transform .12s ease; }
.rp-diff-ep.open .rp-diff-ep-caret{ transform:rotate(90deg); }
.rp-diff-ep-body{ display:none; border-top:1px solid var(--border); padding:4px 0; }
.rp-diff-ep.open .rp-diff-ep-body{ display:block; }
.rp-diff-field{ padding:7px 13px 7px 37px; font-size:11.5px; border-bottom:1px solid var(--border); }
.rp-diff-field:last-child{ border-bottom:none; }
.rp-diff-field-path{ font-family:var(--mono); color:var(--text-dim); margin-bottom:3px; }
.rp-diff-line{ font-family:var(--mono); font-size:11px; padding:2px 8px; border-radius:4px; white-space:pre-wrap; word-break:break-word; margin-bottom:2px; }
.rp-diff-line.rm{ background:var(--danger-soft); color:var(--danger); }
.rp-diff-line.add{ background:color-mix(in srgb, #2e9e5b 14%, transparent); color:#2e9e5b; }
.rp-diff-line.rm::before{ content:"− "; }
.rp-diff-line.add::before{ content:"+ "; }

.rp-mergebar{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:18px; padding-top:16px; border-top:1px dashed var(--border); flex-wrap:wrap; }
.rp-mergebar-note{ font-size:11.5px; color:var(--text-faint); }
.rp-merge-btn{
  font-size:12.5px; font-weight:700; padding:9px 18px; border-radius:999px;
  background:var(--accent); border:1px solid var(--accent); color:var(--accent-contrast, #fff); cursor:pointer;
}
.rp-merge-btn:hover:not(:disabled){ opacity:.9; }
.rp-merge-btn:disabled{ opacity:.4; cursor:not-allowed; background:var(--surface-2); border-color:var(--border); color:var(--text-faint); }
@media (max-width:700px){
  .rp-diffbar{ flex-direction:column; align-items:stretch; }
  .rp-diffbar-swap{ align-self:center; transform:rotate(90deg); }
}

/* ---- New in Release Pipeline v2 ---- */
.rp-quick-preview{
  font-size:11.5px; font-weight:650; color:var(--text-dim); background:var(--surface-2); border:1px solid var(--border);
  border-radius:8px; padding:7px 12px; white-space:nowrap;
}
.rp-quick-preview:hover{ color:var(--text); border-color:var(--border-strong); }
.rp-preview-banner{
  display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--text-dim); background:var(--surface-2);
  border:1px dashed var(--border-strong); border-radius:8px; padding:8px 12px; margin-bottom:14px;
}
.sev-dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; flex-shrink:0; margin-top:5px; }
.sev-dot.critical{ background:var(--danger); }
.sev-dot.high{ background:#c98a1f; }
.rp-breaking-list li{ display:flex; align-items:flex-start; }
.rp-note-field{ margin:14px 0; }
.rp-note-field textarea{ width:100%; min-height:60px; resize:vertical; font-family:var(--sans); }
.rp-note-hint{ font-size:10.5px; color:var(--text-faint); margin-top:4px; }

/* ---- Merge history (GitHub-commit-style timeline) ---- */
.mh-list{ display:flex; flex-direction:column; }
.mh-item{ display:flex; gap:12px; padding:14px 0; border-top:1px solid var(--border); }
.mh-item:first-child{ border-top:none; padding-top:0; }
.mh-item-icon{
  width:28px; height:28px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  background:var(--surface-2); border:1px solid var(--border); font-size:13px; margin-top:1px;
}
.mh-item-icon.promote{ color:var(--post); border-color:color-mix(in srgb, var(--post) 40%, var(--border)); }
.mh-item-icon.rollback{ color:#c98a1f; border-color:color-mix(in srgb, #c98a1f 40%, var(--border)); }
.mh-item-icon.mirror{ color:var(--accent); border-color:color-mix(in srgb, var(--accent) 40%, var(--border)); }
.mh-item-main{ flex:1; min-width:0; }
.mh-item-head{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12.5px; }
.mh-env-badge{ font-family:var(--mono); font-size:10.5px; font-weight:800; padding:2px 7px; border-radius:5px; background:var(--surface-2); color:var(--text-dim); }
.mh-item-headline{ font-weight:650; color:var(--text); }
.mh-item-meta{ font-size:11px; color:var(--text-faint); margin-top:2px; }
.mh-item-note{ font-size:12px; color:var(--text-dim); margin-top:6px; white-space:pre-wrap; }
.mh-breaking-toggle{ font-size:10.5px; font-weight:700; color:var(--danger); background:none; border:none; padding:0; margin-top:6px; cursor:pointer; }
.mh-breaking-toggle:hover{ text-decoration:underline; }
.mh-breaking-list{ display:none; margin:8px 0 0; padding:10px 12px; background:var(--danger-soft); border-radius:8px; font-size:11.5px; color:var(--text-dim); line-height:1.6; }
.mh-breaking-list.open{ display:block; }
.mh-breaking-list li{ list-style:none; }
.mh-load-more{
  margin-top:14px; width:100%; padding:9px; border-radius:8px; background:var(--surface-2); border:1px solid var(--border);
  color:var(--text-dim); font-size:12px; font-weight:650;
}
.mh-load-more:hover{ color:var(--text); border-color:var(--border-strong); }
</style>
</head>
<body>
<div class="rp-wrap">
  <div class="rp-header">
    <div class="rp-title">
      <div class="mark">{ }</div>
      <div style="min-width:0;">
        <h1 id="rpProjName">Release Pipeline</h1>
        <div class="sub" id="rpSub">Promote between environments, review breaking changes, and see the full merge history.</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <a class="rp-back" id="rpBackLink" href="/dashboard.html">← Back to dashboard</a>
      <button type="button" class="rp-theme-toggle" id="btnTheme" title="Switch theme">◐</button>
    </div>
  </div>

  <div class="rp-section" id="rpPipelineSection">
    <div class="rp-loading">Loading pipeline status…</div>
  </div>

  <div class="rp-section" id="rpHistorySection">
    <div class="rp-section-title">Merge history</div>
    <div id="rpMergeHistory"><div class="rp-loading">Loading merge history…</div></div>
  </div>
</div>

<script nonce="__CSP_NONCE__">
const AUTH_USER = __AUTH_USER_JSON__;
const ORG_TOKEN = '__ORG_TOKEN__';
const PROJECT_SLUG = __PROJECT_SLUG__;

function escapeHtml(str){
  if(str === undefined || str === null) return '';
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function slugify(str){
  return String(str||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'x';
}
async function apiGet(path){
  const res = await fetch('/api/workspace' + path, { credentials:'same-origin' });
  if(!res.ok){ let msg; try{ msg = (await res.json()).error; }catch(e){} throw new Error(msg || ('Request failed: ' + res.status)); }
  return res.json();
}
async function apiSend(method, path, body){
  const res = await fetch('/api/workspace' + path, {
    method, credentials:'same-origin', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body),
  });
  if(!res.ok){ let msg; try{ msg = (await res.json()).error; }catch(e){} throw new Error(msg || ('Request failed: ' + res.status)); }
  return res.json();
}
function timeAgo(iso){
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.round(diffMs / 60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return `${mins}m ago`;
  const hrs = Math.round(mins / 60);
  if(hrs < 24) return `${hrs}h ago`;
  return `${Math.round(hrs / 24)}d ago`;
}
function toast(msg){
  let t = document.getElementById('rpToast');
  if(!t){
    t = document.createElement('div');
    t.id = 'rpToast';
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface-solid,var(--surface));border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:10px;font-size:12.5px;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>{ t.style.opacity = '0'; }, 3200);
}

const backLink = document.getElementById('rpBackLink');
const pathMatch = window.location.pathname.match(/^\/([^/]+)\/[^/]+\/release\.pipeline\/?$/);
if(pathMatch) backLink.href = '/' + pathMatch[1] + '/dashboard.html';

const THEME_KEY = 'apiStudio_theme';
const btnTheme = document.getElementById('btnTheme');
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  btnTheme.textContent = theme === 'dark' ? '◐' : '◑';
  btnTheme.title = theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
}
applyTheme(localStorage.getItem(THEME_KEY) === 'light' ? 'light' : 'dark');
btnTheme.addEventListener('click', ()=>{
  const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
});

let workspace = { projects:{} };
let proj = null;

function findProjectBySlug(slug){
  const list = Object.values(workspace.projects || {});
  if(!slug) return null;
  return list.find(p=>slugify(p.name) === slug) || null;
}

/* ================================================================
   Pipeline strip + From/To diff + Merge — ported from studio.html's
   Project settings ▸ Release Pipeline (renderReleasePipeline /
   renderReleaseDiffPanel / renderReleaseDiffField), plus:
     - a required release note before Merge is enabled
     - severity dots (critical/high) on each breaking change
     - a one-click "preview all the way to <last stage>" shortcut, using
       the diff endpoint's existing support for comparing ANY two stages
       (only /promote itself requires them to be adjacent)
   ================================================================ */
async function renderReleasePipeline(){
  const section = document.getElementById('rpPipelineSection');
  section.innerHTML = `<div class="rp-loading">Loading pipeline status…</div>`;
  let data;
  try{ data = await apiGet(`/projects/${encodeURIComponent(proj.id)}/versions`); }
  catch(e){
    section.innerHTML = `<div class="rp-loading">Could not load release pipeline status.</div>`;
    return;
  }
  const stages = data.stages;

  const stripHtml = stages.map((s, idx)=>{
    const isDraft = s.isDraftStage;
    const versionLabel = isDraft ? data.draftLabel : (s.versionLabel || 'Nothing promoted');
    return `
      <div class="rp-strip-chip" style="--rp-accent:${escapeHtml(s.color || 'var(--accent)')};">
        <span class="rp-strip-chip-label">${escapeHtml(s.label)}${isDraft ? ' <span class="rp-draft-pill">draft</span>' : ''}</span>
        <span class="rp-strip-chip-version mono${(!isDraft && !s.versionLabel) ? ' empty' : ''}">${escapeHtml(versionLabel)}</span>
        ${!isDraft ? `<button type="button" class="rp-history-toggle" data-history-env="${escapeHtml(s.environmentId)}" data-history-label="${escapeHtml(s.label)}" title="Version history / rollback">History</button>` : ''}
      </div>
      ${idx < stages.length - 1 ? `<span class="rp-strip-arrow"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg></span>` : ''}
    `;
  }).join('');
  const mirrorHtml = data.mirrors.map(m=>
    `<span class="rp-mirror-inline">${escapeHtml(m.label)} auto-mirrors the last stage: <b>${escapeHtml(m.versionLabel || 'not mirrored yet')}</b></span>`
  ).join('');

  const optionLabel = (s)=> `${s.label} — ${s.isDraftStage ? data.draftLabel : (s.versionLabel || 'nothing promoted yet')}`;
  const optHtml = (selectedId)=> stages.map(s=>
    `<option value="${escapeHtml(s.environmentId)}" ${s.environmentId === selectedId ? 'selected' : ''}>${escapeHtml(optionLabel(s))}</option>`
  ).join('');

  let defaultFromIdx = 0;
  for(let i = stages.length - 2; i >= 0; i--){
    if(stages[i].isDraftStage || stages[i].version != null){ defaultFromIdx = i; break; }
  }
  const fromId = stages[defaultFromIdx].environmentId;
  const toId = stages[Math.min(defaultFromIdx + 1, stages.length - 1)].environmentId;
  const lastStageId = stages[stages.length - 1].environmentId;
  const lastStageLabel = stages[stages.length - 1].label;

  section.innerHTML = `
    <div class="rp-strip">${stripHtml}${mirrorHtml}</div>
    <div id="rpHistoryPanel"></div>
    <div class="rp-diffbar">
      <div class="field">
        <label>From</label>
        <select id="rpFromSelect">${optHtml(fromId)}</select>
      </div>
      <button type="button" class="rp-diffbar-swap" id="rpSwapBtn" title="Swap From and To">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
      </button>
      <div class="field">
        <label>To</label>
        <select id="rpToSelect">${optHtml(toId)}</select>
      </div>
      <button type="button" class="rp-quick-preview" id="rpPreviewAllBtn" title="Compare the draft directly against ${escapeHtml(lastStageLabel)}, skipping the stages in between">Preview full pipeline impact →</button>
    </div>
    <div id="rpDiffPanel"><div class="rp-loading">Loading diff…</div></div>
  `;

  section.querySelectorAll('[data-history-env]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const envId = btn.getAttribute('data-history-env');
      const label = btn.getAttribute('data-history-label');
      const panel = document.getElementById('rpHistoryPanel');
      if(panel.getAttribute('data-open-env') === envId){
        panel.innerHTML = ''; panel.removeAttribute('data-open-env');
        return;
      }
      panel.setAttribute('data-open-env', envId);
      panel.innerHTML = `<div class="rp-loading" style="padding:16px 0;">Loading history for ${escapeHtml(label)}…</div>`;
      let history;
      try{
        ({ history } = await apiGet(`/projects/${encodeURIComponent(proj.id)}/versions/${encodeURIComponent(envId)}/history`));
      }catch(e){
        panel.innerHTML = `<div class="rp-diff-nochanges">Could not load history for ${escapeHtml(label)}.</div>`;
        return;
      }
      if(!history.length){
        panel.innerHTML = `<div class="rp-history-list"><div class="rp-history-empty">Nothing has been promoted into ${escapeHtml(label)} yet.</div></div>`;
        return;
      }
      const rowsHtml = history.map((h, idx)=>{
        const isCurrent = idx === 0;
        const when = new Date(h.promoted_at).toLocaleString();
        const actionLabel = h.action === 'rollback' ? 'Rolled back' : (h.auto_mirrored ? 'Auto-mirrored' : 'Promoted');
        return `
          <div class="rp-history-row${isCurrent ? ' current' : ''}">
            <div class="rp-history-row-main">
              <span class="mono">v1.0.${h.version}</span>
              <span class="hint" style="margin:0;color:var(--text-faint);">${actionLabel}${h.source_environment_id ? ' from ' + escapeHtml(h.source_environment_id) : ''} by ${escapeHtml(h.promoted_by_username || 'unknown')} · ${escapeHtml(when)}</span>
            </div>
            ${isCurrent
              ? `<span class="hint" style="margin:0;color:var(--text-faint);">Currently live</span>`
              : `<button type="button" style="background:none;border:1px solid var(--border);border-radius:7px;padding:5px 10px;font-size:11px;color:var(--text-dim);" data-rollback-history-id="${h.id}">Roll back to this</button>`}
          </div>`;
      }).join('');
      panel.innerHTML = `<div class="rp-history-list"><div class="rp-history-title">Version history — ${escapeHtml(label)}</div>${rowsHtml}</div>`;
      panel.querySelectorAll('[data-rollback-history-id]').forEach(rbBtn=>{
        rbBtn.addEventListener('click', async ()=>{
          const historyId = rbBtn.getAttribute('data-rollback-history-id');
          if(!confirm(`Roll back ${label}? This replaces what's currently live in ${label} with this earlier version. It's recorded as a new history entry — nothing is deleted.`)) return;
          rbBtn.disabled = true; rbBtn.textContent = 'Rolling back…';
          try{
            const result = await apiSend('POST', `/projects/${encodeURIComponent(proj.id)}/rollback`, { environmentId: envId, historyId });
            toast(`${label} rolled back to ${result.versionLabel}`);
            renderReleasePipeline();
            renderMergeHistory();
          }catch(e){
            toast(e.message || 'Could not roll back.');
            rbBtn.disabled = false; rbBtn.textContent = 'Roll back to this';
          }
        });
      });
    });
  });

  const fromSel = document.getElementById('rpFromSelect');
  const toSel = document.getElementById('rpToSelect');
  let previewMode = false;

  async function loadDiff(){
    const from = fromSel.value, to = toSel.value;
    const panel = document.getElementById('rpDiffPanel');
    if(from === to){
      panel.innerHTML = `<div class="rp-diff-nochanges">Pick two different stages to compare.</div>`;
      return;
    }
    panel.innerHTML = `<div class="rp-loading">Comparing…</div>`;
    let diff;
    try{
      diff = await apiGet(`/projects/${encodeURIComponent(proj.id)}/diff?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);
    }catch(e){
      panel.innerHTML = `<div class="rp-diff-nochanges">Could not load diff.</div>`;
      return;
    }
    renderReleaseDiffPanel(panel, diff, previewMode);
  }

  fromSel.addEventListener('change', ()=>{ previewMode = false; loadDiff(); });
  toSel.addEventListener('change', ()=>{ previewMode = false; loadDiff(); });
  document.getElementById('rpSwapBtn').addEventListener('click', ()=>{
    const f = fromSel.value, t = toSel.value;
    fromSel.value = t; toSel.value = f;
    previewMode = false;
    loadDiff();
  });
  document.getElementById('rpPreviewAllBtn').addEventListener('click', ()=>{
    fromSel.value = stages[0].environmentId;
    toSel.value = lastStageId;
    previewMode = true;
    loadDiff();
  });

  loadDiff();
}

function severityIcon(sev){
  return sev === 'critical' ? '⛔' : '⚠';
}

function renderReleaseDiffField(c){
  const fmt = (v)=> (v === null || v === undefined) ? '(empty)' : (typeof v === 'object' ? JSON.stringify(v) : String(v));
  let lines;
  if(c.kind === 'added') lines = `<div class="rp-diff-line add">${escapeHtml(fmt(c.after))}</div>`;
  else if(c.kind === 'removed') lines = `<div class="rp-diff-line rm">${escapeHtml(fmt(c.before))}</div>`;
  else lines = `<div class="rp-diff-line rm">${escapeHtml(fmt(c.before))}</div><div class="rp-diff-line add">${escapeHtml(fmt(c.after))}</div>`;
  return `<div class="rp-diff-field"><div class="rp-diff-field-path mono">${escapeHtml(c.path || '(root)')}</div>${lines}</div>`;
}

function renderReleaseDiffPanel(panel, diff, previewMode){
  const total = diff.summary.added + diff.summary.removed + diff.summary.modified;
  const summaryHtml = `
    <div class="rp-diff-summary">
      <span class="rp-diff-count added"><span class="swatch"></span>${diff.summary.added} added</span>
      <span class="rp-diff-count removed"><span class="swatch"></span>${diff.summary.removed} removed</span>
      <span class="rp-diff-count modified"><span class="swatch"></span>${diff.summary.modified} modified</span>
    </div>`;

  const previewBannerHtml = (previewMode && !diff.canMerge) ? `
    <div class="rp-preview-banner">👁 Preview only — comparing ${escapeHtml(diff.from.label)} directly against ${escapeHtml(diff.to.label)}, skipping the stages in between. Promote through each stage in order to actually ship this.</div>
  ` : '';

  // Severity-ranked (server already sorts critical-first — see
  // breakingChangeDetector.js) so a reviewer sees "this will 404" before
  // "this will fail validation."
  const breakingChanges = Array.isArray(diff.breakingChanges) ? diff.breakingChanges : [];
  const hasBreaking = breakingChanges.length > 0;
  const criticalCount = breakingChanges.filter(b=>b.severity==='critical').length;
  const breakingHtml = hasBreaking ? `
    <div class="rp-breaking-callout">
      <div class="rp-breaking-head">
        <span class="rp-breaking-icon">⚠</span>
        ${breakingChanges.length} breaking change${breakingChanges.length === 1 ? '' : 's'} in this promotion${criticalCount ? ` (${criticalCount} critical)` : ''}
      </div>
      <ul class="rp-breaking-list">
        ${breakingChanges.map(b => `<li><span class="sev-dot ${escapeHtml(b.severity||'high')}"></span>${escapeHtml(b.message)}</li>`).join('')}
      </ul>
      <label class="rp-breaking-ack">
        <input type="checkbox" id="rpAckBreaking" />
        I've reviewed these breaking changes and want to proceed anyway.
      </label>
    </div>` : '';

  const epRow = (kind, ep, marker)=>{
    const changeCount = kind === 'modified' ? ep.changes.length : 0;
    return `
      <div class="rp-diff-ep ${kind}" data-ep-id="${escapeHtml(ep.id)}">
        <div class="rp-diff-ep-head">
          <span class="rp-diff-marker">${marker}</span>
          <span class="rp-diff-ep-method">${escapeHtml(ep.method || '')}</span>
          <span class="rp-diff-ep-path mono">${escapeHtml(ep.path || '(no path)')}</span>
          <span class="rp-diff-ep-summary">${escapeHtml(ep.summary || '')}</span>
          ${changeCount ? `<span class="rp-diff-ep-count">${changeCount} field${changeCount === 1 ? '' : 's'} changed</span>` : ''}
          ${kind === 'modified' ? `<span class="rp-diff-ep-caret">▸</span>` : ''}
        </div>
        ${kind === 'modified' ? `<div class="rp-diff-ep-body">${ep.changes.map(renderReleaseDiffField).join('')}</div>` : ''}
      </div>`;
  };

  const rows = [
    ...diff.added.map(ep => epRow('added', ep, '+')),
    ...diff.removed.map(ep => epRow('removed', ep, '−')),
    ...diff.modified.map(ep => epRow('modified', ep, '~')),
  ];

  // Required release note (Release Pipeline v2) — captured on the actual
  // promote call, not just implied by the diff. Only shown when merging is
  // actually possible (adjacent stages) — a pure preview has nothing to note.
  const noteHtml = diff.canMerge ? `
    <div class="rp-note-field">
      <label for="rpNoteInput" style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text-faint);display:block;margin-bottom:5px;">Release note (required)</label>
      <textarea id="rpNoteInput" placeholder="What's in this release, and why? e.g. &quot;Adds pagination to /payments/status; fixes the digitide callback signature check.&quot;"></textarea>
      <div class="rp-note-hint">Shown in the merge history below — this is the record of "why," not "what."</div>
    </div>` : '';

  panel.innerHTML = `
    ${summaryHtml}
    ${previewBannerHtml}
    ${breakingHtml}
    ${total
      ? `<div class="rp-diff-list">${rows.join('')}</div>`
      : `<div class="rp-diff-nochanges">No differences between ${escapeHtml(diff.from.label)} and ${escapeHtml(diff.to.label)} — they're already in sync.</div>`}
    ${noteHtml}
    <div class="rp-mergebar">
      <div class="rp-mergebar-note">${diff.canMerge
        ? `Merging freezes ${escapeHtml(diff.from.label)}'s current content and makes it live in ${escapeHtml(diff.to.label)}.`
        : `${escapeHtml(diff.to.label)} isn't the next stage after ${escapeHtml(diff.from.label)} — promote through each stage in order.`}</div>
      <button type="button" class="rp-merge-btn" id="rpMergeBtn" ${(diff.canMerge && total) ? '' : 'disabled'}>Merge into ${escapeHtml(diff.to.label)}</button>
    </div>
  `;

  panel.querySelectorAll('.rp-diff-ep.modified .rp-diff-ep-head').forEach(head=>{
    head.addEventListener('click', ()=> head.closest('.rp-diff-ep').classList.toggle('open'));
  });

  const mergeBtn = document.getElementById('rpMergeBtn');
  const ackBox = document.getElementById('rpAckBreaking');
  const noteInput = document.getElementById('rpNoteInput');
  const mergeFundamentallyAllowed = mergeBtn && !mergeBtn.disabled;
  if(mergeFundamentallyAllowed && hasBreaking){
    mergeBtn.disabled = true;
    ackBox.addEventListener('change', ()=>{ mergeBtn.disabled = !ackBox.checked; });
  }
  if(mergeFundamentallyAllowed){
    mergeBtn.addEventListener('click', async ()=>{
      const releaseNote = (noteInput && noteInput.value || '').trim();
      if(!releaseNote){
        toast('A release note is required before merging.');
        if(noteInput) noteInput.focus();
        return;
      }
      const confirmMsg = hasBreaking
        ? `This freezes ${diff.from.label}'s current content and makes it live in ${diff.to.label}, including ${breakingChanges.length} breaking change${breakingChanges.length === 1 ? '' : 's'} you've acknowledged. Anyone viewing ${diff.to.label} will see this exact version until it's promoted again.`
        : `This freezes ${diff.from.label}'s current content and makes it live in ${diff.to.label}. Anyone viewing ${diff.to.label} will see this exact version until it's promoted again.`;
      if(!confirm(`Merge into ${diff.to.label}?\n\n${confirmMsg}`)) return;
      mergeBtn.disabled = true; mergeBtn.textContent = 'Merging…';
      try{
        const result = await apiSend('POST', `/projects/${encodeURIComponent(proj.id)}/promote`, {
          fromEnvironmentId: diff.from.environmentId,
          diffToken: diff.diffToken,
          ackBreakingChanges: hasBreaking ? !!(ackBox && ackBox.checked) : undefined,
          releaseNote,
        });
        toast(`Merged into ${result.toEnvironmentLabel} — ${result.versionLabel}`
          + (result.mirrored ? ` · ${result.mirrored.label} auto-mirrored` : '')
          + (result.breakingChangesCount ? ` · ${result.breakingChangesCount} breaking change${result.breakingChangesCount === 1 ? '' : 's'} included` : ''));
        renderReleasePipeline();
        renderMergeHistory();
      }catch(e){
        toast(e.message || 'Could not merge.');
        renderReleasePipeline();
      }
    });
  }
}

/* ================================================================
   Merge history — GitHub-commit-style timeline across EVERY environment
   for this project (see GET /projects/:id/release-history). Read-mostly:
   rollback stays on the per-stage History panel above, scoped to one
   environment, which is where historyId already makes sense; this feed is
   for seeing the whole story at a glance and reading past release notes.
   ================================================================ */
function mhActionMeta(entry){
  if(entry.autoMirrored) return { icon: '⇄', cls: 'mirror', headline: `Auto-mirrored into ${entry.environmentLabel}` };
  if(entry.action === 'rollback') return { icon: '↺', cls: 'rollback', headline: `Rolled back ${entry.environmentLabel}` };
  return { icon: '↑', cls: 'promote', headline: `Promoted into ${entry.environmentLabel}` };
}

async function renderMergeHistory(){
  const el = document.getElementById('rpMergeHistory');
  el.innerHTML = `<div class="rp-loading">Loading merge history…</div>`;
  let data;
  try{ data = await apiGet(`/projects/${encodeURIComponent(proj.id)}/release-history?limit=100`); }
  catch(e){
    el.innerHTML = `<div class="rp-empty">Could not load merge history.</div>`;
    return;
  }
  const entries = data.entries || [];
  if(!entries.length){
    el.innerHTML = `<div class="rp-empty">Nothing has been promoted yet — merge history will show up here once you promote out of Draft.</div>`;
    return;
  }
  const itemsHtml = entries.map(entry=>{
    const meta = mhActionMeta(entry);
    const breaking = Array.isArray(entry.breakingChanges) ? entry.breakingChanges : [];
    const uid = 'mh-' + entry.id;
    return `
      <div class="mh-item">
        <div class="mh-item-icon ${meta.cls}">${meta.icon}</div>
        <div class="mh-item-main">
          <div class="mh-item-head">
            <span class="mh-item-headline">${escapeHtml(meta.headline)}</span>
            <span class="mh-env-badge mono">v1.0.${entry.version}</span>
            ${entry.sourceEnvironmentLabel ? `<span style="font-size:11px;color:var(--text-faint);">from ${escapeHtml(entry.sourceEnvironmentLabel)}</span>` : ''}
          </div>
          <div class="mh-item-meta">${escapeHtml(entry.promotedByUsername || 'unknown')} · ${timeAgo(entry.promotedAt)}</div>
          ${entry.releaseNote ? `<div class="mh-item-note">${escapeHtml(entry.releaseNote)}</div>` : ''}
          ${breaking.length ? `
            <button type="button" class="mh-breaking-toggle" data-mh-toggle="${uid}">⚠ ${breaking.length} breaking change${breaking.length===1?'':'s'} — show</button>
            <ul class="mh-breaking-list" id="${uid}">
              ${breaking.map(b=>`<li><span class="sev-dot ${escapeHtml(b.severity||'high')}"></span>${escapeHtml(b.message)}</li>`).join('')}
            </ul>` : ''}
        </div>
      </div>`;
  }).join('');
  el.innerHTML = `<div class="mh-list">${itemsHtml}</div>`;
  el.querySelectorAll('[data-mh-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const list = document.getElementById(btn.getAttribute('data-mh-toggle'));
      const open = list.classList.toggle('open');
      const count = list.querySelectorAll('li').length;
      btn.textContent = `⚠ ${count} breaking change${count===1?'':'s'} — ${open ? 'hide' : 'show'}`;
    });
  });
}

async function boot(){
  try{
    workspace = await apiGet('');
  }catch(e){
    console.error(e);
    document.getElementById('rpPipelineSection').innerHTML = `<div class="rp-loading">Could not load your workspace — check your connection and reload.</div>`;
    document.getElementById('rpMergeHistory').innerHTML = '';
    return;
  }
  proj = findProjectBySlug(PROJECT_SLUG);
  if(!proj){
    document.getElementById('rpProjName').textContent = 'Project not found';
    document.getElementById('rpSub').textContent = 'Open this tool from a project\u2019s Project settings.';
    document.getElementById('rpPipelineSection').innerHTML = '';
    document.getElementById('rpMergeHistory').innerHTML = '';
    return;
  }
  document.getElementById('rpProjName').textContent = proj.name;
  document.getElementById('rpSub').textContent = `Release Pipeline · ${proj.name}`;
  renderReleasePipeline();
  renderMergeHistory();
}

boot();
</script>
</body>
</html>
