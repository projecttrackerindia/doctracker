<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found · DocTracker</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/auth.css">
<script src="/js/theme.js"></script>
<style>
  .nf{ max-width:480px; margin:100px auto; padding:0 24px; text-align:center; }
  .nf-mark{ font-family:ui-monospace,monospace; font-size:15px; font-weight:800; color:var(--accent);
    background:var(--accent-soft); width:44px; height:44px; border-radius:12px; display:flex; align-items:center;
    justify-content:center; margin:0 auto 20px; }
  .nf h1{ font-size:22px; margin:0 0 8px; }
  .nf p{ color:var(--text-dim); font-size:14px; margin:0 0 24px; }
  .nf a{ display:inline-block; background:var(--accent); color:var(--accent-ink); text-decoration:none;
    font-weight:700; font-size:13px; padding:10px 20px; border-radius:8px; }
  .nf a:hover{ filter:brightness(1.08); }
</style>
</head>
<body>
<div class="nf">
  <div class="nf-mark">{ }</div>
  <h1>Page not found</h1>
  <p>That address doesn't match anything in DocTracker — it may have moved, or the link might have a typo.</p>
  <a href="/">Back to DocTracker</a>
</div>
</body>
</html>
