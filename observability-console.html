<title>Observability Console</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

/* ============================================================
   TOKENS — mirrors DocTracker's own palette exactly (dark-first,
   with a light override), so this reads as part of the same
   product rather than a bolted-on third-party tool.
   ============================================================ */
:root{
  --sans:'Inter', system-ui, -apple-system, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, 'SF Mono', monospace;

  --bg:#0a0e15; --bg-elevated:#0d1219; --surface:#121822; --surface-2:#171f2b;
  --surface-hover:#1c2531; --border:#212a38; --border-strong:#2c3648;

  --text:#e9edf5; --text-dim:#909cb0; --text-faint:#576277;

  --accent:#5c7cfa; --accent-ink:#f4f7ff;
  --accent-soft:rgba(92,124,250,.14); --accent-soft-strong:rgba(92,124,250,.22);

  --danger:#ef5c6e; --danger-soft:rgba(239,92,110,.14);

  --get:#4fa3f7; --get-bg:rgba(79,163,247,.14);
  --post:#35c491; --post-bg:rgba(53,196,145,.14);
  --put:#e0a83e; --put-bg:rgba(224,168,62,.14);
  --patch:#b389f0; --patch-bg:rgba(179,137,240,.14);
  --delete:#ef5c6e; --delete-bg:rgba(239,92,110,.14);

  --env-dev:#8a97b3; --env-dev-bg:rgba(138,151,179,.16);
  --env-sit:#35b8c9; --env-sit-bg:rgba(53,184,201,.16);
  --env-uat:#8b7cf6; --env-uat-bg:rgba(139,124,246,.16);
  --env-preprod:#e0a83e; --env-preprod-bg:rgba(224,168,62,.16);
  --env-prod:#ef5c6e; --env-prod-bg:rgba(239,92,110,.16);
  --env-dr:#c4529a; --env-dr-bg:rgba(196,82,154,.16);

  --st-2:#35c491; --st-3:#4fa3f7; --st-4:#e0a83e; --st-5:#ef5c6e;

  --radius-sm:6px; --radius-md:10px; --radius-lg:14px;
}
:root:not([data-theme="light"]){ color-scheme:dark; }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a0e15; --bg-elevated:#0d1219; --surface:#121822; --surface-2:#171f2b;
    --surface-hover:#1c2531; --border:#212a38; --border-strong:#2c3648;
    --text:#e9edf5; --text-dim:#909cb0; --text-faint:#576277;
  }
}
:root[data-theme="light"], :root:not([data-theme="dark"]):not([data-theme="light"]) {
  /* system default renders as light unless the OS prefers dark, handled above */
}
[data-theme="light"], :root{
  --bg:#f5f6fa; --bg-elevated:#ffffff; --surface:#ffffff; --surface-2:#f1f3f8;
  --surface-hover:#e9ecf4; --border:#e1e5ee; --border-strong:#ccd3e2;
  --text:#12151f; --text-dim:#5a6479; --text-faint:#8993a8;
  --accent:#4a5fe0; --accent-ink:#ffffff;
  --accent-soft:rgba(74,95,224,.09); --accent-soft-strong:rgba(74,95,224,.16);
  --danger:#d13750; --danger-soft:rgba(209,55,80,.10);
  --get:#1f6fd6; --get-bg:rgba(31,111,214,.10);
  --post:#1c8f66; --post-bg:rgba(28,143,102,.10);
  --put:#a06f10; --put-bg:rgba(160,111,16,.10);
  --patch:#7a4fd1; --patch-bg:rgba(122,79,209,.10);
  --delete:#d13750; --delete-bg:rgba(209,55,80,.10);
  --env-dev:#5b6478; --env-dev-bg:rgba(91,100,120,.10);
  --env-sit:#147f8c; --env-sit-bg:rgba(20,127,140,.10);
  --env-uat:#6a4fe0; --env-uat-bg:rgba(106,79,224,.10);
  --env-preprod:#a06f10; --env-preprod-bg:rgba(160,111,16,.10);
  --env-prod:#d13750; --env-prod-bg:rgba(209,55,80,.10);
  --env-dr:#9c3a79; --env-dr-bg:rgba(156,58,121,.10);
  --st-2:#1c8f66; --st-3:#1f6fd6; --st-4:#a06f10; --st-5:#d13750;
}
:root[data-theme="dark"]{
  --bg:#0a0e15; --bg-elevated:#0d1219; --surface:#121822; --surface-2:#171f2b;
  --surface-hover:#1c2531; --border:#212a38; --border-strong:#2c3648;
  --text:#e9edf5; --text-dim:#909cb0; --text-faint:#576277;
  --accent:#5c7cfa; --accent-ink:#f4f7ff;
  --accent-soft:rgba(92,124,250,.14); --accent-soft-strong:rgba(92,124,250,.22);
  --danger:#ef5c6e; --danger-soft:rgba(239,92,110,.14);
  --get:#4fa3f7; --get-bg:rgba(79,163,247,.14);
  --post:#35c491; --post-bg:rgba(53,196,145,.14);
  --put:#e0a83e; --put-bg:rgba(224,168,62,.14);
  --patch:#b389f0; --patch-bg:rgba(179,137,240,.14);
  --delete:#ef5c6e; --delete-bg:rgba(239,92,110,.14);
  --env-dev:#8a97b3; --env-dev-bg:rgba(138,151,179,.16);
  --env-sit:#35b8c9; --env-sit-bg:rgba(53,184,201,.16);
  --env-uat:#8b7cf6; --env-uat-bg:rgba(139,124,246,.16);
  --env-preprod:#e0a83e; --env-preprod-bg:rgba(224,168,62,.16);
  --env-prod:#ef5c6e; --env-prod-bg:rgba(239,92,110,.16);
  --env-dr:#c4529a; --env-dr-bg:rgba(196,82,154,.16);
  --st-2:#35c491; --st-3:#4fa3f7; --st-4:#e0a83e; --st-5:#ef5c6e;
  color-scheme:dark;
}

/* ============================================================ BASE */
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family:var(--sans); background:var(--bg); color:var(--text);
  font-size:13.5px; -webkit-font-smoothing:antialiased; overflow:hidden;
  font-feature-settings:'tnum' 0;
}
.mono{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
button{ font-family:inherit; }
::-webkit-scrollbar{width:9px;height:9px;} ::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:5px;}

.app{ display:grid; grid-template-columns:270px 1fr; height:100%; padding-top:env(safe-area-inset-top,0px); }
@media (max-width:860px){ .app{ grid-template-columns:1fr; height:auto; overflow:visible; } body{ overflow:auto; } }

/* ============================================================ SIDEBAR */
.sidebar{ background:var(--bg-elevated); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
@media (max-width:860px){ .sidebar{ border-right:none; border-bottom:1px solid var(--border); max-height:360px; } }
.brand{ display:flex; align-items:center; gap:10px; padding:16px 16px 14px; flex-shrink:0; }
.brand-mark{ width:30px;height:30px;border-radius:9px; background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%, #8b7cf6)); display:flex;align-items:center;justify-content:center;flex-shrink:0; box-shadow:0 2px 10px -2px var(--accent-soft-strong); }
.brand-mark svg{ width:16px;height:16px; color:#fff; }
.brand-text .t1{ font-size:13.5px; font-weight:800; letter-spacing:-.2px; line-height:1.15; }
.brand-text .t2{ font-size:10px; color:var(--text-faint); font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
.theme-btn{ margin-left:auto; width:26px;height:26px;border-radius:7px; border:1px solid var(--border); background:var(--surface); color:var(--text-faint); display:flex;align-items:center;justify-content:center; cursor:pointer; flex-shrink:0; }
.theme-btn:hover{ color:var(--text); border-color:var(--border-strong); }
.theme-btn svg{ width:13px;height:13px; }

.sidebar-search{ position:relative; margin:0 12px 10px; flex-shrink:0; }
.sidebar-search svg{ position:absolute; left:9px; top:50%; transform:translateY(-50%); width:12px;height:12px; color:var(--text-faint); pointer-events:none; }
.sidebar-search input{ width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:7px; padding:7px 9px 7px 27px; font-size:12px; font-family:inherit; }
.sidebar-search input::placeholder{ color:var(--text-faint); }

.sidebar-scroll{ flex:1; overflow-y:auto; padding:0 8px 14px; }
.sidebar-section-label{ font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.6px; color:var(--text-faint); padding:10px 8px 6px; }

.all-traffic-row{ display:flex; align-items:center; gap:9px; padding:8px 8px; border-radius:8px; cursor:pointer; margin:0 0 4px; }
.all-traffic-row:hover{ background:var(--surface-hover); }
.all-traffic-row.active{ background:var(--accent-soft); color:var(--accent); }
.all-traffic-row svg{ width:14px;height:14px; flex-shrink:0; }
.all-traffic-row .lbl{ font-size:12.5px; font-weight:700; flex:1; }

.api-group{ margin-bottom:2px; }
.api-row{ display:flex; align-items:center; gap:8px; padding:8px 8px; border-radius:8px; cursor:pointer; }
.api-row:hover{ background:var(--surface-hover); }
.api-row.active{ background:var(--accent-soft); }
.api-caret{ width:9px;height:9px; color:var(--text-faint); flex-shrink:0; transition:transform .15s ease; }
.api-group.open .api-caret{ transform:rotate(90deg); }
.api-dot{ width:7px;height:7px;border-radius:50%; flex-shrink:0; }
.api-name{ font-size:12.5px; font-weight:650; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.api-rate{ font-size:10px; font-family:var(--mono); color:var(--text-faint); flex-shrink:0; }
.ep-list{ display:none; padding:2px 0 4px 21px; }
.api-group.open .ep-list{ display:block; }
.ep-row{ display:flex; align-items:center; gap:7px; padding:5px 7px; border-radius:6px; cursor:pointer; }
.ep-row:hover{ background:var(--surface-hover); }
.ep-row.active{ background:var(--accent-soft); }
.ep-row.active .ep-path{ color:var(--accent); }
.ep-path{ font-family:var(--mono); font-size:10.8px; color:var(--text-dim); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ep-badge{ font-size:8.5px; font-weight:800; padding:1.5px 5px; border-radius:4px; flex-shrink:0; letter-spacing:.2px; }
.ep-badge.get{ background:var(--get-bg); color:var(--get); } .ep-badge.post{ background:var(--post-bg); color:var(--post); }
.ep-badge.put{ background:var(--put-bg); color:var(--put); } .ep-badge.patch{ background:var(--patch-bg); color:var(--patch); }
.ep-badge.delete{ background:var(--delete-bg); color:var(--delete); }
.ep-hits{ font-size:9.5px; color:var(--text-faint); font-family:var(--mono); flex-shrink:0; }
.sidebar-empty{ padding:14px 10px; font-size:11.5px; color:var(--text-faint); text-align:center; }

/* ============================================================ MAIN */
.main{ overflow-y:auto; padding:18px 22px 40px; }
@media (max-width:860px){ .main{ overflow-y:visible; } }

.topbar{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:16px; }
.scope{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.scope-crumb{ font-size:11px; color:var(--text-faint); font-family:var(--mono); }
.scope-title{ font-size:19px; font-weight:800; letter-spacing:-.3px; display:flex; align-items:center; gap:9px; }
.scope-title .badge-lg{ font-size:11px; font-weight:800; padding:3px 9px; border-radius:6px; }
.scope-title .badge-lg.get{ background:var(--get-bg); color:var(--get); } .scope-title .badge-lg.post{ background:var(--post-bg); color:var(--post); }
.scope-title .badge-lg.put{ background:var(--put-bg); color:var(--put); } .scope-title .badge-lg.patch{ background:var(--patch-bg); color:var(--patch); }
.scope-title .badge-lg.delete{ background:var(--delete-bg); color:var(--delete); }
.scope-sub{ font-size:11.5px; color:var(--text-faint); margin-top:3px; }
.clear-scope{ font-size:11px; color:var(--accent); background:var(--accent-soft); border:none; padding:5px 10px; border-radius:999px; cursor:pointer; font-weight:700; }
.clear-scope:hover{ background:var(--accent-soft-strong); }

.filters{ display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
.filter-group{ display:flex; align-items:center; gap:4px; background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:3px; }
.filter-chip{ border:none; background:transparent; color:var(--text-faint); font-size:11px; font-weight:700; padding:6px 11px; border-radius:999px; cursor:pointer; white-space:nowrap; }
.filter-chip.on{ background:var(--accent); color:var(--accent-ink); }
.env-chip{ border:1px solid var(--border); background:var(--surface); color:var(--text-faint); font-size:10.5px; font-weight:700; padding:5px 9px; border-radius:999px; cursor:pointer; }
.env-chip.on.dev{ background:var(--env-dev-bg); color:var(--env-dev); border-color:var(--env-dev); }
.env-chip.on.sit{ background:var(--env-sit-bg); color:var(--env-sit); border-color:var(--env-sit); }
.env-chip.on.uat{ background:var(--env-uat-bg); color:var(--env-uat); border-color:var(--env-uat); }
.env-chip.on.preprod{ background:var(--env-preprod-bg); color:var(--env-preprod); border-color:var(--env-preprod); }
.env-chip.on.prod{ background:var(--env-prod-bg); color:var(--env-prod); border-color:var(--env-prod); }
.env-chip.on.dr{ background:var(--env-dr-bg); color:var(--env-dr); border-color:var(--env-dr); }

.kpi-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:11px; margin:18px 0; }
.kpi-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:13px 15px; position:relative; overflow:hidden; }
.kpi-card::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--kpi-accent, var(--border-strong)); }
.kpi-label{ font-size:10px; text-transform:uppercase; letter-spacing:.4px; color:var(--text-faint); font-weight:700; margin-bottom:7px; }
.kpi-value{ font-family:var(--mono); font-size:22px; font-weight:800; display:flex; align-items:center; gap:7px; }
.kpi-dot{ width:6px;height:6px;border-radius:50%; background:var(--kpi-accent, var(--text-faint)); flex-shrink:0; }
.kpi-sub{ font-size:10.5px; color:var(--text-faint); margin-top:6px; }

.section{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px 18px; margin-bottom:16px; }
.section-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:2px; }
.section-title{ font-size:13px; font-weight:750; }
.section-sub{ font-size:11px; color:var(--text-faint); margin-bottom:12px; margin-top:2px; }
.grid2{ display:grid; grid-template-columns:1.3fr 1fr; gap:14px; }
@media (max-width:1050px){ .grid2{ grid-template-columns:1fr; } }

.health-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:12px; cursor:pointer; }
.health-row:last-child{ border-bottom:none; }
.health-row:hover{ background:var(--surface-hover); margin:0 -8px; padding-left:8px; padding-right:8px; border-radius:6px; }
.hdot{ width:7px;height:7px;border-radius:50%; flex-shrink:0; }
.hdot.g{ background:var(--post); } .hdot.y{ background:var(--put); } .hdot.r{ background:var(--delete); }
.health-name{ flex:1; min-width:0; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.health-meta{ color:var(--text-faint); font-size:11px; font-family:var(--mono); white-space:nowrap; }

.vol-chart{ display:flex; align-items:flex-end; gap:3px; height:100px; margin-bottom:4px; }
.vol-bar{ flex:1; background:var(--accent); border-radius:2px 2px 0 0; opacity:.55; min-height:2px; position:relative; }
.vol-bar.hot{ opacity:1; }
.vol-axis{ display:flex; justify-content:space-between; font-size:9.5px; color:var(--text-faint); margin-bottom:14px; }

.statusbar{ height:10px; border-radius:5px; overflow:hidden; display:flex; background:var(--surface-2); margin-bottom:8px; }
.statusbar span{ height:100%; }
.status-legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--text-faint); }
.status-legend .k{ display:inline-flex; align-items:center; gap:5px; }
.status-legend i{ width:8px;height:8px;border-radius:2px; display:inline-block; }

.ip-list{ display:flex; flex-direction:column; gap:7px; }
.ip-row{ display:grid; grid-template-columns:8px 130px 1fr auto; align-items:center; gap:9px; }
.ip-dot{ width:8px;height:8px;border-radius:50%; }
.ip-addr{ font-family:var(--mono); font-size:11.5px; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ip-track{ height:6px; background:var(--surface-2); border-radius:3px; overflow:hidden; }
.ip-bar{ height:100%; border-radius:3px; }
.ip-count{ font-family:var(--mono); font-size:11px; color:var(--text-faint); text-align:right; white-space:nowrap; }
.ip-legend{ display:flex; gap:14px; margin-top:12px; font-size:10.5px; color:var(--text-faint); }
.ip-legend .k{ display:inline-flex; align-items:center; gap:5px; }
.ip-legend i{ width:7px;height:7px;border-radius:50%; display:inline-block; }

.alert-row{ display:flex; gap:11px; padding:10px 0; border-bottom:1px solid var(--border); font-size:12.5px; align-items:flex-start; }
.alert-row:last-child{ border-bottom:none; }
.alert-row.ack{ opacity:.45; }
.sev-bar{ width:4px; align-self:stretch; border-radius:3px; flex-shrink:0; min-height:32px; }
.sev-bar.crit{ background:var(--delete); } .sev-bar.warn{ background:var(--put); } .sev-bar.info{ background:var(--get); }
.alert-body{ flex:1; min-width:0; }
.alert-title{ font-weight:650; }
.alert-meta{ color:var(--text-faint); font-size:11px; margin-top:3px; }
.ack-btn{ border:1px solid var(--border); background:var(--surface); color:var(--text-dim); font-size:10.5px; font-weight:700; padding:5px 10px; border-radius:7px; cursor:pointer; flex-shrink:0; white-space:nowrap; }
.ack-btn:hover{ border-color:var(--border-strong); color:var(--text); }
.no-alerts{ color:var(--text-faint); font-size:12px; padding:10px 0; }

.toolbar{ display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; margin-bottom:13px; }
.field{ display:flex; flex-direction:column; gap:4px; }
.field label{ font-size:10px; color:var(--text-faint); font-weight:700; text-transform:uppercase; letter-spacing:.3px; }
.field select, .field input[type="text"]{ background:var(--bg-elevated); border:1px solid var(--border); color:var(--text); border-radius:7px; padding:6.5px 9px; font-size:12px; font-family:inherit; min-width:0; }
.field.grow{ flex:1; min-width:160px; }

.table-scroll{ overflow-x:auto; border-radius:9px; border:1px solid var(--border); }
table.log-table{ width:100%; border-collapse:collapse; font-size:12px; min-width:640px; }
table.log-table th{ text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.4px; color:var(--text-faint); font-weight:700; padding:9px 12px; background:var(--surface-2); border-bottom:1px solid var(--border); white-space:nowrap; }
table.log-table td{ padding:8px 12px; border-bottom:1px solid var(--border); vertical-align:top; }
table.log-table tr:last-child td{ border-bottom:none; }
table.log-table tbody tr{ cursor:pointer; }
table.log-table tbody tr:hover td{ background:var(--surface-hover); }
table.log-table tbody tr.sel td{ background:var(--accent-soft); }
.lvl-pill{ font-size:9.5px; font-weight:800; padding:2px 7px; border-radius:5px; letter-spacing:.2px; }
.lvl-pill.ERROR{ background:var(--delete-bg); color:var(--delete); } .lvl-pill.WARN{ background:var(--put-bg); color:var(--put); }
.lvl-pill.INFO{ background:var(--get-bg); color:var(--get); } .lvl-pill.DEBUG{ background:var(--surface-2); color:var(--text-faint); }
.empty-row td{ text-align:center; color:var(--text-faint); padding:20px !important; }

.trace{ border-top:1px dashed var(--border); margin-top:14px; padding-top:13px; font-size:12px; }
.trace-head{ color:var(--text-faint); margin-bottom:9px; }
.hop{ display:flex; align-items:center; gap:10px; padding:6px 0; }
.hop-dot{ width:6px;height:6px;border-radius:50%; background:var(--accent); flex-shrink:0; }
.hop b{ min-width:190px; }
.hop .ms{ margin-left:auto; font-family:var(--mono); }
.hop.err .hop-dot{ background:var(--delete); }
.hop.err b{ color:var(--delete); }

.cluster-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); font-size:12px; }
.cluster-row:last-child{ border-bottom:none; }
.cluster-msg{ min-width:0; }
.cluster-sig{ font-weight:600; }
.cluster-meta{ color:var(--text-faint); font-size:10.5px; margin-top:2px; font-family:var(--mono); }
.cluster-count{ background:var(--delete-bg); color:var(--delete); font-weight:800; border-radius:999px; padding:2px 10px; font-size:11px; flex-shrink:0; font-family:var(--mono); }

.footnote{ color:var(--text-faint); font-size:11px; margin-top:6px; line-height:1.6; }
.hint-banner{ font-size:11.5px; color:var(--accent); background:var(--accent-soft); border:1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius:9px; padding:9px 13px; margin-bottom:16px; }
</style>

<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 6"></polyline><polyline points="15 6 21 6 21 12"></polyline></svg></div>
      <div class="brand-text"><div class="t1">DocTracker</div><div class="t2">Observability</div></div>
      <button class="theme-btn" id="themeBtn" title="Toggle theme" type="button"></button>
    </div>
    <div class="sidebar-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="sidebarSearch" placeholder="Filter APIs / endpoints…" autocomplete="off">
    </div>
    <div class="sidebar-scroll" id="sidebarScroll"></div>
  </aside>

  <main class="main" id="main"></main>
</div>

<script>
(function(){
"use strict";

/* ============================================================
   DATA MODEL
   Sample/illustrative traffic only — this is a working UI
   prototype, not a live feed. Every number below is generated
   deterministically (seeded), not hand-picked, so the KPIs, log
   table, clustering and IP breakdown all stay internally
   consistent with each other and with whatever scope/filters
   are applied, the same way they would against a real log feed.
============================================================ */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashSeed(str){ var h = 2166136261; for(var i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

var ENVS = ['dev','sit','uat','preprod','prod','dr'];
var ENV_LABEL = { dev:'DEV', sit:'SIT', uat:'UAT', preprod:'PREPROD', prod:'PROD', dr:'DR' };
var ENV_WEIGHT = { dev:0.06, sit:0.10, uat:0.14, preprod:0.06, prod:0.60, dr:0.04 };

var APIS = [
  { name:'Loan Origination', tag:'loan-disbursal-api', baseRps:2.1, errBias:1.8, endpoints:[
    { method:'POST', path:'/disbursal', msgs:['Disbursal completed successfully','Downstream core-banking call failed: connection reset','Validation error: missing loan reference'] },
    { method:'GET', path:'/disbursal/{id}/status', msgs:['Status lookup served from cache','Status lookup served from core-banking'] },
    { method:'POST', path:'/disbursal/{id}/cancel', msgs:['Disbursal cancelled by ops','Cannot cancel — already settled'] },
  ]},
  { name:'WhatsApp Pay', tag:'whatsapp-pay-notify-flow', baseRps:3.4, errBias:1.1, endpoints:[
    { method:'POST', path:'/pay/notify', msgs:['Notification delivered','SFTP timeout while pushing payment receipt'] },
    { method:'POST', path:'/pay/receipt', msgs:['Receipt archived','Receipt template render failed'] },
  ]},
  { name:'Darwinbox Sync', tag:'darwinbox-sync-api', baseRps:0.6, errBias:0.6, endpoints:[
    { method:'GET', path:'/employee/delta', msgs:['Delta payload size within bounds','Retry #1 on employee delta fetch'] },
    { method:'POST', path:'/employee/ack', msgs:['Ack recorded'] },
  ]},
  { name:'Self-Service Token', tag:'self-service-token-gateway', baseRps:5.8, errBias:0.4, endpoints:[
    { method:'POST', path:'/token/issue', msgs:['Token issued for user session'] },
    { method:'POST', path:'/token/refresh', msgs:['Token cache refreshed','Rate limit nearing threshold for client app'] },
    { method:'POST', path:'/token/revoke', msgs:['Token revoked'] },
  ]},
  { name:'Collections', tag:'rezolve-collection-api', baseRps:1.3, errBias:1.4, endpoints:[
    { method:'POST', path:'/collection/sync', msgs:['Daily reconciliation job started','Validation error: missing loan reference'] },
    { method:'GET', path:'/collection/reconciliation', msgs:['Reconciliation report generated'] },
  ]},
  { name:'Lead Ingest', tag:'sf-lead-ingest-flow', baseRps:0.9, errBias:1.0, endpoints:[
    { method:'POST', path:'/lead/ingest', msgs:['Batch sync completed','Auth token expired mid-batch','Circuit breaker half-open, probing Salesforce API'] },
    { method:'GET', path:'/lead/{id}', msgs:['Lead payload served'] },
  ]},
];

var INTERNAL_IPS = ['10.2.7.14','10.2.7.51','172.19.4.8','192.168.30.6','10.4.0.22'];
var EXTERNAL_IPS = ['49.249.62.162','49.207.186.65','103.87.58.21','115.99.28.142','203.129.11.40','2401:4900:2345:46fb:fc0a:d604:164d:f390'];

var NOW = Date.now();
var DAYS = 30;

function buildEndpointId(apiIdx, epIdx){ return apiIdx+':'+epIdx; }

// One flat log dataset drives every panel — KPIs, charts, clustering,
// alerts and the IP breakdown are all *derived* from LOGS by the
// current filter, not separately hand-authored, so changing a filter
// keeps every panel mutually consistent (the point of the "focus on
// functionality" ask).
var LOGS = [];
var EP_META = {}; // id -> {rps, errRate, p95}

(function generate(){
  APIS.forEach(function(api, ai){
    api.endpoints.forEach(function(ep, ei){
      var id = buildEndpointId(ai, ei);
      var rnd = mulberry32(hashSeed(api.tag + ep.path));
      var rps = api.baseRps * (0.5 + rnd()*1.1) / api.endpoints.length;
      var errRate = Math.min(0.14, Math.max(0.001, (api.errBias/100) * (0.4 + rnd()*1.8)));
      var p95 = Math.round(90 + rnd()*550);
      var ipPool = [];
      for(var k=0;k<3;k++) ipPool.push(INTERNAL_IPS[Math.floor(rnd()*INTERNAL_IPS.length)]);
      for(var k2=0;k2<3;k2++) ipPool.push(EXTERNAL_IPS[Math.floor(rnd()*EXTERNAL_IPS.length)]);
      EP_META[id] = { rps: rps, errRate: errRate, p95: p95, api: api, ep: ep, ai: ai, ei: ei };

      // A SAMPLE of the endpoint's traffic over the range, not a full
      // request-for-request replay (real "rps" for a busy gateway would be
      // tens of thousands of rows here - far more than a browser tab
      // should hold or a person should scroll). Weighted by the endpoint's
      // relative rps so busier endpoints still look busier in the sidebar
      // hit counts and log-volume chart, capped to stay snappy.
      var totalOverRange = Math.min(1400, Math.round(180 + rps * 260));
      for(var n=0;n<totalOverRange;n++){
        var tOffsetDays = rnd()*DAYS;
        var ts = NOW - tOffsetDays*86400000;
        var envRoll = rnd(), acc = 0, env = 'prod';
        for(var e=0;e<ENVS.length;e++){ acc += ENV_WEIGHT[ENVS[e]]; if(envRoll <= acc){ env = ENVS[e]; break; } }
        var isErr = rnd() < errRate;
        var lvl, status;
        if(isErr){ lvl = (rnd()<0.75)?'ERROR':'WARN'; status = (rnd()<0.6)?500:(rnd()<0.5?503:422); }
        else { var r2 = rnd(); lvl = r2<0.5?'INFO':(r2<0.85?'DEBUG':'WARN'); status = lvl==='WARN' && rnd()<0.3 ? 429 : 200; }
        var msgPool = ep.msgs;
        var msg = isErr ? (msgPool.find(function(m){return /fail|error|timeout|expired|missing|cannot/i.test(m);}) || msgPool[msgPool.length-1]) : msgPool[Math.floor(rnd()*msgPool.length)];
        var ms = Math.round(p95 * (isErr ? (1.2+rnd()*3) : (0.25+rnd()*1.1)));
        var ip = ipPool[Math.floor(rnd()*ipPool.length)];
        LOGS.push({
          ts: ts, apiIdx: ai, epIdx: ei, api: api.tag, apiName: api.name,
          method: ep.method, path: ep.path, env: env, lvl: lvl, msg: msg,
          ms: ms, status: status, ip: ip, trace: 'tr-' + hashSeed(api.tag+ep.path+n).toString(16).slice(0,6)
        });
      }
    });
  });
  LOGS.sort(function(a,b){ return b.ts - a.ts; });
})();

/* ============================================================
   STATE
============================================================ */
var STATE = {
  scope: { type:'all', apiIdx:null, epIdx:null },
  envs: new Set(ENVS),
  rangeDays: 7,
  level: 'All',
  q: '',
  openApis: new Set(),
  ackedAlerts: new Set(),
  selectedTrace: null,
};

function loadPrefs(){
  try{
    var raw = localStorage.getItem('obsx.prefs');
    if(raw){
      var p = JSON.parse(raw);
      if(p.ackedAlerts) STATE.ackedAlerts = new Set(p.ackedAlerts);
      if(p.openApis) STATE.openApis = new Set(p.openApis);
      if(p.theme) document.documentElement.setAttribute('data-theme', p.theme);
    }
  }catch(e){}
}
function savePrefs(){
  try{
    localStorage.setItem('obsx.prefs', JSON.stringify({
      ackedAlerts: Array.from(STATE.ackedAlerts),
      openApis: Array.from(STATE.openApis),
      theme: document.documentElement.getAttribute('data-theme') || ''
    }));
  }catch(e){}
}

/* ============================================================
   FILTERING — the single source every panel reads from.
============================================================ */
function classifyIp(ip){
  if(!ip) return 'unknown';
  if(/^(10\.|127\.|192\.168\.|169\.254\.)/.test(ip)) return 'internal';
  var m = ip.match(/^172\.(\d{1,3})\./);
  if(m && +m[1]>=16 && +m[1]<=31) return 'internal';
  if(/^f[cd][0-9a-f]{2}:/i.test(ip)) return 'internal';
  return 'external';
}

function filteredLogs(){
  var cutoff = NOW - STATE.rangeDays*86400000;
  var q = STATE.q.trim().toLowerCase();
  return LOGS.filter(function(l){
    if(l.ts < cutoff) return false;
    if(!STATE.envs.has(l.env)) return false;
    if(STATE.level !== 'All' && l.lvl !== STATE.level) return false;
    if(STATE.scope.type === 'api' && l.apiIdx !== STATE.scope.apiIdx) return false;
    if(STATE.scope.type === 'endpoint' && (l.apiIdx !== STATE.scope.apiIdx || l.epIdx !== STATE.scope.epIdx)) return false;
    if(q && !(l.msg.toLowerCase().indexOf(q)>-1 || l.api.toLowerCase().indexOf(q)>-1 || l.path.toLowerCase().indexOf(q)>-1 || l.trace.toLowerCase().indexOf(q)>-1 || l.ip.toLowerCase().indexOf(q)>-1)) return false;
    return true;
  });
}

function pct(sorted, p){
  if(!sorted.length) return 0;
  var idx = Math.min(sorted.length-1, Math.floor(p*sorted.length));
  return sorted[idx];
}

/* ============================================================
   RENDER: sidebar
============================================================ */
function endpointTodayHits(ai, ei){
  var cutoff = NOW - 86400000;
  var n = 0;
  for(var i=0;i<LOGS.length;i++){ var l=LOGS[i]; if(l.ts<cutoff) break; if(l.apiIdx===ai && l.epIdx===ei) n++; }
  return n;
}
function apiErrorRate(ai){
  var cutoff = NOW - 86400000;
  var total=0, err=0;
  for(var i=0;i<LOGS.length;i++){ var l=LOGS[i]; if(l.ts<cutoff) break; if(l.apiIdx===ai){ total++; if(l.status>=400) err++; } }
  return total ? err/total : 0;
}
function healthDot(rate){ return rate>=0.03 ? 'r' : (rate>=0.01 ? 'y' : 'g'); }

function renderSidebar(){
  var q = document.getElementById('sidebarSearch').value.trim().toLowerCase();
  var html = '';
  html += '<div class="sidebar-section-label">Overview</div>';
  html += '<div class="all-traffic-row' + (STATE.scope.type==='all'?' active':'') + '" data-all="1">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>' +
          '<span class="lbl">All traffic</span></div>';
  html += '<div class="sidebar-section-label">APIs</div>';

  var any = false;
  APIS.forEach(function(api, ai){
    var eps = api.endpoints.filter(function(ep){
      if(!q) return true;
      return api.name.toLowerCase().indexOf(q)>-1 || api.tag.toLowerCase().indexOf(q)>-1 || ep.path.toLowerCase().indexOf(q)>-1;
    });
    if(q && !eps.length) return;
    any = true;
    var isOpen = STATE.openApis.has(ai) || (q && eps.length);
    var rate = apiErrorRate(ai);
    var apiActive = STATE.scope.type==='api' && STATE.scope.apiIdx===ai;
    html += '<div class="api-group' + (isOpen?' open':'') + '" data-api-group="'+ai+'">';
    html += '<div class="api-row' + (apiActive?' active':'') + '" data-api="'+ai+'">' +
            '<svg class="api-caret" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5l8 7-8 7z"></path></svg>' +
            '<span class="api-dot" style="background:' + (rate>=0.03?'var(--delete)':rate>=0.01?'var(--put)':'var(--post)') + ';"></span>' +
            '<span class="api-name">' + api.name + '</span>' +
            '<span class="api-rate mono">' + (rate*100).toFixed(1) + '%</span></div>';
    html += '<div class="ep-list">';
    (q ? eps : api.endpoints).forEach(function(ep){
      var ei = api.endpoints.indexOf(ep);
      var epActive = STATE.scope.type==='endpoint' && STATE.scope.apiIdx===ai && STATE.scope.epIdx===ei;
      var hits = endpointTodayHits(ai, ei);
      html += '<div class="ep-row' + (epActive?' active':'') + '" data-api="'+ai+'" data-ep="'+ei+'">' +
              '<span class="ep-badge ' + ep.method.toLowerCase() + '">' + ep.method + '</span>' +
              '<span class="ep-path">' + ep.path + '</span>' +
              '<span class="ep-hits">' + hits.toLocaleString() + '/d</span></div>';
    });
    html += '</div></div>';
  });
  if(!any) html += '<div class="sidebar-empty">No APIs match "' + escapeHtml(q) + '".</div>';

  document.getElementById('sidebarScroll').innerHTML = html;

  document.querySelectorAll('[data-all]').forEach(function(el){
    el.addEventListener('click', function(){ STATE.scope = {type:'all', apiIdx:null, epIdx:null}; renderAll(); });
  });
  document.querySelectorAll('.api-row').forEach(function(el){
    el.addEventListener('click', function(){
      var ai = +el.getAttribute('data-api');
      if(STATE.openApis.has(ai)) STATE.openApis.delete(ai); else STATE.openApis.add(ai);
      STATE.scope = { type:'api', apiIdx: ai, epIdx: null };
      savePrefs(); renderAll();
    });
  });
  document.querySelectorAll('.ep-row').forEach(function(el){
    el.addEventListener('click', function(e){
      e.stopPropagation();
      STATE.scope = { type:'endpoint', apiIdx: +el.getAttribute('data-api'), epIdx: +el.getAttribute('data-ep') };
      renderAll();
    });
  });
}

function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function methodClass(m){ return (m||'get').toLowerCase(); }
function fmtDate(ts){
  var d = new Date(ts);
  function p(n){ return n<10?'0'+n:n; }
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function fmtDay(ts){
  var d = new Date(ts);
  return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()] + ' ' + d.getDate();
}

/* ============================================================
   RENDER: main
============================================================ */
function renderAll(){
  renderSidebar();
  renderMain();
  savePrefs();
}

function scopeInfo(){
  if(STATE.scope.type === 'api'){
    var api = APIS[STATE.scope.apiIdx];
    return { title: api.name, sub: api.tag + ' — ' + api.endpoints.length + ' endpoint(s)', badge:null };
  }
  if(STATE.scope.type === 'endpoint'){
    var api2 = APIS[STATE.scope.apiIdx], ep = api2.endpoints[STATE.scope.epIdx];
    return { title: ep.path, sub: api2.name + ' (' + api2.tag + ')', badge: ep.method };
  }
  return { title:'All traffic', sub: APIS.length + ' APIs · ' + APIS.reduce(function(s,a){return s+a.endpoints.length;},0) + ' endpoints tracked', badge:null };
}

function renderMain(){
  var main = document.getElementById('main');
  var logs = filteredLogs();
  var info = scopeInfo();

  var msArr = logs.map(function(l){return l.ms;}).sort(function(a,b){return a-b;});
  var p50 = pct(msArr, 0.50), p95 = pct(msArr, 0.95), p99 = pct(msArr, 0.99);
  var total = logs.length;
  var errCount = logs.filter(function(l){return l.status>=400;}).length;
  var errRate = total ? errCount/total : 0;
  var uptime = Math.max(95, 100 - errRate*100*0.35);

  var alerts = computeAlerts();
  var activeAlerts = alerts.filter(function(a){ return !STATE.ackedAlerts.has(a.id); });

  var kpiAccent = function(v, warnAt, badAt){ return v>=badAt?'--delete':(v>=warnAt?'--put':'--post'); };

  var html = '';
  html += '<div class="topbar">';
  html += '  <div class="scope">';
  html += '    <div class="scope-crumb">Observability' + (STATE.scope.type!=='all' ? ' / ' + (STATE.scope.type==='endpoint'?info.sub+' /':'') : '') + '</div>';
  html += '    <div class="scope-title">' + (info.badge ? '<span class="badge-lg ' + methodClass(info.badge) + '">'+info.badge+'</span>' : '') + '<span class="mono" style="font-family:' + (STATE.scope.type==='endpoint'?'var(--mono)':'var(--sans)') + ';">' + escapeHtml(info.title) + '</span>' + (STATE.scope.type!=='all' ? '<button class="clear-scope" id="clearScope">Clear</button>' : '') + '</div>';
  html += '    <div class="scope-sub">' + escapeHtml(info.sub) + '</div>';
  html += '  </div>';
  html += '  <div class="filters">';
  html += '    <div class="filter-group">' + [1,7,30].map(function(d){ return '<button class="filter-chip' + (STATE.rangeDays===d?' on':'') + '" data-range="'+d+'">' + (d===1?'24h':d+'d') + '</button>'; }).join('') + '</div>';
  html += '    <div class="filter-group" style="gap:5px;padding:4px 6px;">' + ENVS.map(function(e){ return '<button class="env-chip' + (STATE.envs.has(e)?' on '+e:'') + '" data-env="'+e+'">' + ENV_LABEL[e] + '</button>'; }).join('') + '</div>';
  html += '  </div>';
  html += '</div>';

  if(total === 0){
    html += '<div class="hint-banner">No traffic matches the current filters — try widening the time range or re-enabling an environment.</div>';
  }

  html += '<div class="kpi-grid">';
  html += kpi('Requests', total.toLocaleString(), STATE.rangeDays===1?'last 24h':'last '+STATE.rangeDays+'d');
  html += kpi('Error rate', (errRate*100).toFixed(2)+'%', errCount.toLocaleString()+' error(s)', kpiAccent(errRate,0.01,0.03));
  html += kpi('Latency p95', p95+'ms', 'p50 '+p50+'ms · p99 '+p99+'ms', kpiAccent(p95,300,600));
  html += kpi('Uptime (est.)', uptime.toFixed(2)+'%', 'illustrative, from error rate');
  html += kpi('Active alerts', String(activeAlerts.length), activeAlerts.filter(function(a){return a.sev==='crit';}).length + ' critical', activeAlerts.length ? (activeAlerts.some(function(a){return a.sev==='crit';})?'--delete':'--put') : '--post');
  html += '</div>';

  if(STATE.scope.type !== 'endpoint'){
    html += '<div class="grid2">';
    html += renderServiceHealth();
    html += renderVolumeAndStatus(logs);
    html += '</div>';
  } else {
    html += '<div class="grid2">';
    html += renderStatusPanel(logs);
    html += renderIpPanel(logs);
    html += '</div>';
  }

  if(STATE.scope.type === 'endpoint'){
    html += '<div class="grid2">';
    html += renderVolumeAndStatus(logs, true);
    html += renderAlertsPanel(alerts);
    html += '</div>';
  } else {
    html += '<div class="grid2">';
    html += renderIpPanel(logs);
    html += renderAlertsPanel(alerts);
    html += '</div>';
  }

  html += renderLogExplorer(logs);
  html += renderClustering(logs);

  html += '<div class="footnote">Sample/illustrative data for this prototype — every KPI, chart and cluster above is computed live from a generated log set, the same way it would be from a real MuleSoft log feed. Field values from real requests are never captured, same policy as ops/sit-doc-agent.</div>';

  main.innerHTML = html;
  wireMainEvents(logs);
}

function kpi(label, value, sub, accentVar){
  return '<div class="kpi-card"' + (accentVar?' style="--kpi-accent:var('+accentVar+');"':'') + '>' +
    '<div class="kpi-label">' + label + '</div>' +
    '<div class="kpi-value">' + (accentVar?'<span class="kpi-dot"></span>':'') + '<span class="mono">' + value + '</span></div>' +
    '<div class="kpi-sub">' + sub + '</div></div>';
}

function renderServiceHealth(){
  var cutoff = NOW - 86400000;
  var rows = APIS.map(function(api, ai){
    var total=0, err=0, msSum=0;
    for(var i=0;i<LOGS.length;i++){ var l=LOGS[i]; if(l.ts<cutoff) break; if(l.apiIdx===ai){ total++; msSum+=l.ms; if(l.status>=400) err++; } }
    var rate = total?err/total:0;
    return { ai:ai, name:api.name, rate:rate, total:total, avgMs: total?Math.round(msSum/total):0 };
  }).sort(function(a,b){ return b.rate-a.rate; });

  var body = rows.map(function(r){
    return '<div class="health-row" data-jump-api="' + r.ai + '">' +
      '<span class="hdot ' + healthDot(r.rate) + '"></span>' +
      '<span class="health-name">' + escapeHtml(r.name) + '</span>' +
      '<span class="health-meta">' + (r.rate*100).toFixed(1) + '% err · ' + r.avgMs + 'ms avg · ' + r.total.toLocaleString() + ' req/24h</span></div>';
  }).join('') || '<div class="no-alerts">No traffic in the last 24h.</div>';

  return '<div class="section"><div class="section-head"><div class="section-title">Service health — API status</div></div>' +
    '<div class="section-sub">Last 24h, all environments · sorted by error rate</div>' + body + '</div>';
}

function renderVolumeAndStatus(logs, compact){
  var buckets = 14, spanMs = STATE.rangeDays*86400000, bucketMs = spanMs/buckets;
  var counts = new Array(buckets).fill(0);
  var maxTs = NOW, minTs = NOW - spanMs;
  logs.forEach(function(l){
    var idx = Math.floor((l.ts - minTs)/bucketMs);
    if(idx>=0 && idx<buckets) counts[idx]++;
  });
  var max = Math.max.apply(null, counts.concat([1]));
  var bars = counts.map(function(c,i){
    var h = Math.max(3, Math.round(c/max*100));
    return '<div class="vol-bar' + (i>=buckets-3?' hot':'') + '" style="height:'+h+'%;" title="' + c.toLocaleString() + ' request(s)"></div>';
  }).join('');

  var byLvl = { INFO:0, DEBUG:0, WARN:0, ERROR:0 };
  logs.forEach(function(l){ byLvl[l.lvl] = (byLvl[l.lvl]||0)+1; });
  var lvlTotal = logs.length || 1;

  return '<div class="section">' +
    '<div class="section-title">Log volume</div>' +
    '<div class="section-sub">' + logs.length.toLocaleString() + ' log lines over the selected range</div>' +
    '<div class="vol-chart">' + bars + '</div>' +
    '<div class="vol-axis"><span>' + fmtDay(minTs) + '</span><span>' + fmtDay(maxTs) + '</span></div>' +
    (compact ? '' : (
      '<div class="section-title" style="margin-top:6px;">Log level distribution</div>' +
      '<div class="statusbar">' +
        '<span style="width:'+(byLvl.ERROR/lvlTotal*100)+'%;background:var(--delete);"></span>' +
        '<span style="width:'+(byLvl.WARN/lvlTotal*100)+'%;background:var(--put);"></span>' +
        '<span style="width:'+(byLvl.INFO/lvlTotal*100)+'%;background:var(--get);"></span>' +
        '<span style="width:'+(byLvl.DEBUG/lvlTotal*100)+'%;background:var(--surface-hover);border:1px solid var(--border);"></span>' +
      '</div>' +
      '<div class="status-legend">' +
        '<span class="k"><i style="background:var(--delete);"></i>ERROR '+byLvl.ERROR.toLocaleString()+'</span>' +
        '<span class="k"><i style="background:var(--put);"></i>WARN '+byLvl.WARN.toLocaleString()+'</span>' +
        '<span class="k"><i style="background:var(--get);"></i>INFO '+byLvl.INFO.toLocaleString()+'</span>' +
        '<span class="k"><i style="background:var(--text-faint);"></i>DEBUG '+byLvl.DEBUG.toLocaleString()+'</span>' +
      '</div>'
    )) +
    '</div>';
}

function renderStatusPanel(logs){
  var buckets = { '2xx':0,'3xx':0,'4xx':0,'5xx':0 };
  logs.forEach(function(l){ var f = String(l.status)[0]+'xx'; if(buckets[f]!==undefined) buckets[f]++; });
  var total = logs.length || 1;
  return '<div class="section">' +
    '<div class="section-title">Status code breakdown</div>' +
    '<div class="section-sub">This endpoint, current filters</div>' +
    '<div class="statusbar">' +
      '<span style="width:'+(buckets['2xx']/total*100)+'%;background:var(--st-2);"></span>' +
      '<span style="width:'+(buckets['3xx']/total*100)+'%;background:var(--st-3);"></span>' +
      '<span style="width:'+(buckets['4xx']/total*100)+'%;background:var(--st-4);"></span>' +
      '<span style="width:'+(buckets['5xx']/total*100)+'%;background:var(--st-5);"></span>' +
    '</div>' +
    '<div class="status-legend">' +
      Object.keys(buckets).map(function(k){ return '<span class="k"><i style="background:var(--st-'+k[0]+');"></i>'+k+' '+buckets[k].toLocaleString()+'</span>'; }).join('') +
    '</div></div>';
}

function renderIpPanel(logs){
  var counts = {};
  logs.forEach(function(l){ counts[l.ip] = (counts[l.ip]||0)+1; });
  var top = Object.keys(counts).map(function(ip){ return {ip:ip, count:counts[ip]}; }).sort(function(a,b){ return b.count-a.count; }).slice(0,8);
  var max = top.length ? top[0].count : 1;
  var total = logs.length || 1;

  var rows = top.map(function(x){
    var cls = classifyIp(x.ip);
    var color = cls==='internal' ? 'var(--accent)' : 'var(--put)';
    var barPct = Math.round(x.count/max*100);
    var share = Math.round(x.count/total*100);
    return '<div class="ip-row">' +
      '<span class="ip-dot" style="background:'+color+';" title="'+cls+'"></span>' +
      '<span class="ip-addr" title="'+escapeHtml(x.ip)+' ('+cls+')">'+escapeHtml(x.ip)+'</span>' +
      '<span class="ip-track"><span class="ip-bar" style="width:'+barPct+'%;background:'+color+';"></span></span>' +
      '<span class="ip-count">'+x.count.toLocaleString()+' <span style="opacity:.7;">('+share+'%)</span></span></div>';
  }).join('') || '<div class="no-alerts">No source IPs in range.</div>';

  return '<div class="section"><div class="section-title">Top source IPs</div>' +
    '<div class="section-sub">Ranked by request count, current scope + filters</div>' +
    '<div class="ip-list">' + rows + '</div>' +
    '<div class="ip-legend"><span class="k"><i style="background:var(--accent);"></i>Internal / infra range</span><span class="k"><i style="background:var(--put);"></i>External</span></div></div>';
}

var ALERT_DEFS = null;
function computeAlerts(){
  if(ALERT_DEFS) return ALERT_DEFS;
  var cutoff = NOW - 86400000;
  var out = [];
  APIS.forEach(function(api, ai){
    api.endpoints.forEach(function(ep, ei){
      var total=0, err=0, msArr=[];
      for(var i=0;i<LOGS.length;i++){ var l=LOGS[i]; if(l.ts<cutoff) break; if(l.apiIdx===ai && l.epIdx===ei){ total++; msArr.push(l.ms); if(l.status>=400) err++; } }
      if(!total) return;
      var rate = err/total;
      var meta = EP_META[buildEndpointId(ai,ei)];
      if(rate >= 0.03){
        out.push({ id:'err-'+ai+'-'+ei, sev: rate>=0.06?'crit':'warn', title: api.tag + ' — error rate ' + (rate*100).toFixed(1) + '% on ' + ep.method + ' ' + ep.path, meta: total.toLocaleString()+' req/24h · anomaly detector', ai:ai, ei:ei });
      }
      msArr.sort(function(a,b){return a-b;});
      var p95 = pct(msArr, 0.95);
      if(p95 > meta.p95*1.6){
        out.push({ id:'lat-'+ai+'-'+ei, sev:'warn', title: api.tag + ' — p95 latency drifted to ' + p95 + 'ms on ' + ep.method + ' ' + ep.path, meta: 'baseline ~' + meta.p95 + 'ms · z-score deviation', ai:ai, ei:ei });
      }
    });
  });
  ALERT_DEFS = out.sort(function(a,b){ return (a.sev==='crit'?0:1) - (b.sev==='crit'?0:1); });
  return ALERT_DEFS;
}

function renderAlertsPanel(alerts){
  var rows = alerts.map(function(a){
    var acked = STATE.ackedAlerts.has(a.id);
    return '<div class="alert-row' + (acked?' ack':'') + '">' +
      '<span class="sev-bar ' + a.sev + '"></span>' +
      '<div class="alert-body" data-jump-ep="' + a.ai + ':' + a.ei + '"><div class="alert-title">' + escapeHtml(a.title) + '</div><div class="alert-meta">' + escapeHtml(a.meta) + '</div></div>' +
      '<button class="ack-btn" data-ack="' + a.id + '">' + (acked?'Unacknowledge':'Acknowledge') + '</button></div>';
  }).join('') || '<div class="no-alerts">No active alerts — nothing above threshold right now.</div>';

  return '<div class="section"><div class="section-title">Alerts &amp; anomalies</div>' +
    '<div class="section-sub">Error-rate threshold (≥3%) and p95 latency drift vs. each endpoint\'s own baseline</div>' + rows + '</div>';
}

function renderLogExplorer(logs){
  var rows = logs.slice(0, 200).map(function(l, idx){
    var ipCls = classifyIp(l.ip);
    var ipColor = ipCls==='internal' ? 'var(--accent)' : 'var(--put)';
    return '<tr data-trace="' + l.trace + '" data-idx="' + LOGS.indexOf(l) + '">' +
      '<td class="mono">' + fmtDate(l.ts) + '</td>' +
      '<td><span class="lvl-pill ' + l.lvl + '">' + l.lvl + '</span></td>' +
      '<td><span class="ep-badge ' + methodClass(l.method) + '" style="font-size:9.5px;">' + l.method + '</span></td>' +
      '<td class="mono">' + escapeHtml(l.path) + '</td>' +
      '<td>' + escapeHtml(l.msg) + '</td>' +
      '<td class="mono">' + l.status + '</td>' +
      '<td class="mono">' + l.ms + '</td>' +
      '<td class="mono"><span class="ip-dot" style="display:inline-block;width:6px;height:6px;margin-right:6px;background:' + ipColor + ';" title="' + ipCls + '"></span>' + escapeHtml(l.ip) + '</td>' +
      '<td class="mono">' + l.trace + '</td></tr>';
  }).join('');

  var html = '<div class="section">' +
    '<div class="section-head"><div class="section-title">Log explorer</div></div>' +
    '<div class="section-sub">Query raw log lines within the current scope, environments and time range — click a row to inspect its trace</div>' +
    '<div class="toolbar">' +
      '<div class="field"><label>Level</label><select id="levelSel">' + ['All','ERROR','WARN','INFO','DEBUG'].map(function(l){ return '<option' + (STATE.level===l?' selected':'') + '>' + l + '</option>'; }).join('') + '</select></div>' +
      '<div class="field grow"><label>Search</label><input type="text" id="qSearch" placeholder="message, API, path, IP or trace id" value="' + escapeHtml(STATE.q) + '"></div>' +
    '</div>' +
    '<div class="table-scroll"><table class="log-table"><tr><th>Time</th><th>Level</th><th>Method</th><th>Path</th><th>Message</th><th>Status</th><th>ms</th><th>Source IP</th><th>Trace</th></tr>' +
    '<tbody id="logRows">' + (rows || '<tr class="empty-row"><td colspan="9">No log lines match this range or filter.</td></tr>') + '</tbody></table></div>' +
    (logs.length > 200 ? '<div class="footnote">Showing the most recent 200 of ' + logs.length.toLocaleString() + ' matching lines.</div>' : '') +
    '<div class="trace" id="traceBox" style="display:none;"></div>' +
    '</div>';
  return html;
}

function renderClustering(logs){
  var errRows = logs.filter(function(l){ return l.lvl==='ERROR'; });
  var map = {};
  errRows.forEach(function(l){
    var key = l.api + '::' + l.msg;
    if(!map[key]) map[key] = { count:0, last:l.ts, api:l.apiName, msg:l.msg, method:l.method, path:l.path };
    map[key].count++;
    if(l.ts > map[key].last) map[key].last = l.ts;
  });
  var list = Object.values(map).sort(function(a,b){ return b.count-a.count; }).slice(0,8);
  var body = list.map(function(d){
    return '<div class="cluster-row"><div class="cluster-msg"><div class="cluster-sig">' + escapeHtml(d.msg) + '</div>' +
      '<div class="cluster-meta">' + escapeHtml(d.api) + ' · ' + d.method + ' ' + escapeHtml(d.path) + ' · last seen ' + fmtDate(d.last) + '</div></div>' +
      '<span class="cluster-count">' + d.count.toLocaleString() + '</span></div>';
  }).join('') || '<div class="no-alerts">No ERROR-level lines in the current scope/range.</div>';

  return '<div class="section"><div class="section-title">Error clustering</div>' +
    '<div class="section-sub">ERROR-level lines grouped by signature, current scope + range</div>' + body + '</div>';
}

function renderTrace(logIdx){
  var log = LOGS[logIdx];
  var box = document.getElementById('traceBox');
  if(!log || !box) return;
  var gw = Math.round(log.ms*0.08), fl = Math.round(log.ms*0.5), cn = log.ms - gw - fl;
  var isErr = log.status >= 400;
  box.style.display = 'block';
  box.innerHTML =
    '<div class="trace-head">Trace <span class="mono">' + log.trace + '</span> · ' + fmtDate(log.ts) + ' · ' + ENV_LABEL[log.env] + ' · total <span class="mono">' + log.ms + 'ms</span></div>' +
    '<div class="hop"><span class="hop-dot"></span><b>API Gateway</b>inbound request accepted<span class="ms">' + gw + 'ms</span></div>' +
    '<div class="hop"><span class="hop-dot"></span><b>Flow: ' + escapeHtml(log.api) + '</b>DataWeave transform + routing<span class="ms">' + fl + 'ms</span></div>' +
    '<div class="hop' + (isErr?' err':'') + '"><span class="hop-dot"></span><b>Downstream connector call</b>' + (isErr?'failed / timed out':'completed') + '<span class="ms">' + cn + 'ms</span></div>';
}

/* ============================================================
   EVENTS
============================================================ */
function wireMainEvents(logs){
  document.querySelectorAll('[data-range]').forEach(function(el){
    el.addEventListener('click', function(){ STATE.rangeDays = +el.getAttribute('data-range'); renderMain(); });
  });
  document.querySelectorAll('[data-env]').forEach(function(el){
    el.addEventListener('click', function(){
      var env = el.getAttribute('data-env');
      if(STATE.envs.has(env)){ if(STATE.envs.size>1) STATE.envs.delete(env); } else STATE.envs.add(env);
      renderMain();
    });
  });
  var clearBtn = document.getElementById('clearScope');
  if(clearBtn) clearBtn.addEventListener('click', function(){ STATE.scope = {type:'all',apiIdx:null,epIdx:null}; renderAll(); });

  var levelSel = document.getElementById('levelSel');
  if(levelSel) levelSel.addEventListener('change', function(){ STATE.level = levelSel.value; renderMain(); });
  var qInput = document.getElementById('qSearch');
  if(qInput) qInput.addEventListener('input', function(){ STATE.q = qInput.value; clearTimeout(window.__qT); window.__qT = setTimeout(renderMain, 180); });

  document.querySelectorAll('#logRows tr[data-idx]').forEach(function(tr){
    tr.addEventListener('click', function(){
      document.querySelectorAll('#logRows tr').forEach(function(r){ r.classList.remove('sel'); });
      tr.classList.add('sel');
      renderTrace(+tr.getAttribute('data-idx'));
    });
  });

  document.querySelectorAll('[data-ack]').forEach(function(el){
    el.addEventListener('click', function(e){
      e.stopPropagation();
      var id = el.getAttribute('data-ack');
      if(STATE.ackedAlerts.has(id)) STATE.ackedAlerts.delete(id); else STATE.ackedAlerts.add(id);
      savePrefs(); renderMain();
    });
  });
  document.querySelectorAll('[data-jump-api]').forEach(function(el){
    el.addEventListener('click', function(){ STATE.scope = { type:'api', apiIdx:+el.getAttribute('data-jump-api'), epIdx:null }; renderAll(); });
  });
  document.querySelectorAll('[data-jump-ep]').forEach(function(el){
    el.addEventListener('click', function(){
      var parts = el.getAttribute('data-jump-ep').split(':');
      STATE.scope = { type:'endpoint', apiIdx:+parts[0], epIdx:+parts[1] };
      renderAll();
    });
  });
}

document.getElementById('sidebarSearch').addEventListener('input', function(){ renderSidebar(); });

/* ============================================================
   THEME TOGGLE
============================================================ */
function themeIcon(isDark){
  return isDark
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"></path></svg>';
}
function currentIsDark(){
  var explicit = document.documentElement.getAttribute('data-theme');
  if(explicit === 'dark') return true;
  if(explicit === 'light') return false;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function refreshThemeBtn(){ document.getElementById('themeBtn').innerHTML = themeIcon(currentIsDark()); }
document.getElementById('themeBtn').addEventListener('click', function(){
  var next = currentIsDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  refreshThemeBtn(); savePrefs();
});

/* ============================================================
   BOOT
============================================================ */
loadPrefs();
refreshThemeBtn();
renderAll();

})();
</script>
